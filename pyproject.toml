[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prnu"
version = "0.1.0"
authors = [
    { name = "Pixel-Master" }
]
description = "A toolkit for PRNU noise extraction, sensor fingerprint comparison, and AI image detection."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "scikit-learn>=1.0.0"
]

[project.urls]
Homepage = "https://Pixel-Master.github.io/prnu"
Repository = "https://github.com/Pixel-Master/prnu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prnu = ["*.pth"]